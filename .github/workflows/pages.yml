name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard-voyages/package-lock.json
      - name: Installer les dépendances
        working-directory: dashboard-voyages
        run: npm ci
      - name: Construire le site
        working-directory: dashboard-voyages
        run: npm run build -- --base=/voyages_deputes_fr/
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Transférer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-voyages/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer le site
        id: deployment
        uses: actions/deploy-pages@v4
